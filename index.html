<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Gastos — Sebastián</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0F1620;
    --surface:#172230;
    --surface-2:#1E2B3B;
    --border:#2A3A4D;
    --text:#EDEFF2;
    --muted:#8A97A6;
    --green:#4ADE94;
    --amber:#F5B942;
    --red:#F0654E;
    --blue:#6C8EEF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    padding:24px 16px 80px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:920px; margin:0 auto;}

  /* Header */
  header{margin-bottom:28px;}
  .eyebrow{color:var(--muted); font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;}
  h1{font-size:22px; font-weight:600;}
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  #selectorMes{
    width:auto; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:8px 12px; font-family:'Inter',sans-serif; font-size:13px;
  }
  .hero,.hero-card,.hero-label,.hero-value,.hero-sub{ } /* legacy, no usados */
  .franja{
    display:grid; grid-template-columns:repeat(4,1fr);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-top:18px; overflow:hidden;
  }
  @media(max-width:640px){.franja{grid-template-columns:1fr 1fr;}}
  .franja-item{
    padding:16px 18px; border-left:1px solid var(--border);
  }
  .franja-item:first-child, .franja-item:nth-child(3){border-left:none;}
  @media(max-width:640px){ .franja-item:nth-child(3){border-left:1px solid var(--border);} .franja-item:nth-child(odd){border-left:none;} }
  .franja-top{display:flex; align-items:center; gap:7px; color:var(--muted); margin-bottom:6px;}
  .franja-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  .ico{width:15px; height:15px; display:inline-flex;}
  .ico svg{width:100%; height:100%;}
  .franja-value{font-size:22px; font-weight:700;}
  .franja-sub{font-size:11px; color:var(--muted); margin-top:4px; min-height:14px;}
  .spark{margin-top:8px; opacity:.85;}
  .delta{font-weight:600;}
  .delta.up{color:var(--red);}
  .delta.down{color:var(--green);}
  .hero-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px;
  }
  .hero-label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  .hero-value{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; margin-top:4px;}
  .hero-sub{font-size:12px; color:var(--muted); margin-top:6px;}
  .signal{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle;}

  /* Section */
  section{margin-top:36px;}
  .section-title{font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .section-title .n{color:var(--muted); font-weight:500; font-size:12px;}

  /* Category ledger */
  .ledger{display:flex; flex-direction:column; gap:8px;}
  .ledger-row{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; display:grid; grid-template-columns:16px 1fr auto; gap:12px; align-items:center;
  }
  .ledger-name{font-size:13px; font-weight:500;}
  .ledger-bar{grid-column:1/-1; height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:2px;}
  .ledger-bar-fill{height:100%; border-radius:4px; transition:width .4s ease;}
  .ledger-amt{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); text-align:right; white-space:nowrap;}

  /* Charts */
  .charts-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media(max-width:640px){.charts-grid{grid-template-columns:1fr;}}
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}

  /* Table */
  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .table-search{padding:12px 14px; border-bottom:1px solid var(--border);}
  .table-search input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 12px; font-family:'Inter',sans-serif; font-size:13px;
  }
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--muted); font-weight:500; padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  td{padding:9px 14px; border-top:1px solid var(--border);}
  td.amt{font-family:'JetBrains Mono',monospace; text-align:right;}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; background:var(--surface-2); color:var(--muted);}

  /* Form */
  .form-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}
  input,select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:'Inter',sans-serif; font-size:13.5px;
  }
  .field{margin-bottom:12px;}
  button{
    background:var(--blue); color:#0F1620; border:none; border-radius:8px; padding:11px 18px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; cursor:pointer; width:100%;
    margin-top:4px;
  }
  button:hover{opacity:.9;}
  button:disabled{opacity:.5; cursor:default;}
  .form-msg{font-size:12.5px; margin-top:10px; min-height:16px;}
  .form-msg.ok{color:var(--green);}
  .form-msg.err{color:var(--red);}

  footer{margin-top:48px; text-align:center; color:var(--muted); font-size:11px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Control Gastos</div>
    <div class="header-row">
      <h1>Cómo va el mes</h1>
      <select id="selectorMes"></select>
    </div>
    <div class="franja">
      <div class="franja-item">
        <div class="franja-top">
          <span class="ico" id="icoGasto"></span>
          <span class="franja-label">Gasto</span>
        </div>
        <div class="franja-value mono" id="heroGasto">$0</div>
        <div class="franja-sub" id="heroGastoSub"></div>
        <div class="spark" id="sparkGasto"></div>
      </div>
      <div class="franja-item">
        <div class="franja-top">
          <span class="ico" id="icoIngreso"></span>
          <span class="franja-label">Ingreso</span>
        </div>
        <div class="franja-value mono" id="heroIngreso">$0</div>
        <div class="franja-sub" id="heroIngresoSub"></div>
        <div class="spark" id="sparkIngreso"></div>
      </div>
      <div class="franja-item">
        <div class="franja-top">
          <span class="ico" id="icoNeto"></span>
          <span class="franja-label">Neto</span>
        </div>
        <div class="franja-value mono" id="heroNeto">$0</div>
        <div class="franja-sub" id="heroNetoSub">ingreso − gasto</div>
        <div class="spark" id="sparkNeto"></div>
      </div>
      <div class="franja-item">
        <div class="franja-top">
          <span class="ico" id="icoAhorro"></span>
          <span class="franja-label">Ahorro</span>
        </div>
        <div class="franja-value mono" id="heroAhorro">$0</div>
        <div class="franja-sub" id="heroAhorroSub"></div>
        <div class="spark" id="sparkAhorro"></div>
      </div>
    </div>
  </header>

  <section>
    <div class="section-title">Categorías <span class="n" id="ledgerCount"></span></div>
    <div class="ledger" id="ledger"><div style="color:var(--muted); font-size:13px;">Cargando…</div></div>
  </section>

  <section>
    <div class="section-title">Tendencia y distribución</div>
    <div class="charts-grid">
      <div class="chart-card"><canvas id="chartTendencia" height="220"></canvas></div>
      <div class="chart-card"><canvas id="chartDona" height="220"></canvas></div>
    </div>
  </section>

  <section>
    <div class="section-title">Registrar movimiento</div>
    <div class="form-card">
      <div class="form-grid">
        <div class="field">
          <label>Tipo</label>
          <select id="fTipo">
            <option value="Gasto">Gasto</option>
            <option value="Ingreso">Ingreso</option>
            <option value="Ahorro">Ahorro</option>
            <option value="Traspaso">Traspaso</option>
          </select>
        </div>
        <div class="field">
          <label>Monto (CLP)</label>
          <input type="number" id="fMonto" placeholder="8500">
        </div>
      </div>
      <div class="field" id="fCategoriaWrap">
        <label>Categoría</label>
        <select id="fCategoria"></select>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Cuenta</label>
          <select id="fCuenta">
            <option value="BCI">BCI</option>
            <option value="Banco Falabella">Banco Falabella</option>
            <option value="Banco de Chile">Banco de Chile</option>
            <option value="Mach">Mach</option>
            <option value="Efectivo">Efectivo</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
        <div class="field">
          <label>Medio</label>
          <select id="fMedio">
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta débito">Tarjeta débito</option>
            <option value="Tarjeta crédito">Tarjeta crédito</option>
            <option value="Efectivo">Efectivo</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Descripción</label>
        <input type="text" id="fDescripcion" placeholder="Ej: almuerzo con amigos">
      </div>
      <button id="fSubmit">Registrar</button>
      <div class="form-msg" id="fMsg"></div>
    </div>
  </section>

  <section>
    <div class="section-title">Movimientos recientes</div>
    <div class="table-wrap">
      <div class="table-search"><input type="text" id="buscador" placeholder="Buscar por comercio o categoría…"></div>
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Comercio</th><th style="text-align:right;">Monto</th></tr></thead>
        <tbody id="tablaBody"><tr><td colspan="5" style="color:var(--muted);">Cargando…</td></tr></tbody>
      </table>
    </div>
  </section>

  <footer>Actualizado en vivo desde tu Google Sheet · datos personales</footer>
</div>

<script>
const CSV_MOVIMIENTOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLfN2qjT0gT6YQloWSrSyJ4eJgZtF1LnCXEjDMZlOlwz_72G0L8lTHNOZmnepcCq3k2dvX7WJ5upLx/pub?gid=0&single=true&output=csv';
const CSV_TOPES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLfN2qjT0gT6YQloWSrSyJ4eJgZtF1LnCXEjDMZlOlwz_72G0L8lTHNOZmnepcCq3k2dvX7WJ5upLx/pub?gid=1363525202&single=true&output=csv';
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxvN2rvCP5jt7xWkcpEsHjokcMoUGFuWsNncUs26oqdAmfrTR_t-MtkYn8TsUz-9pVyjw/exec';
const DASHBOARD_SECRET = 'scc-gastos-2026-x7f2';
const META_INGRESO_MENSUAL = 2600000;

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function fmt(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-CL'); }

function parseFecha(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // ISO: 2026-01-15
  if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  m = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); // 15/01/2026 o 15-01-2026
  if(m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
  return null;
}

function cargarCSV(url){
  return new Promise((resolve) => {
    Papa.parse(url, { download:true, header:true, skipEmptyLines:true, complete: r => resolve(r.data) });
  });
}

const ICONOS = {
  gasto: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l10 10M15 6v9h-9"/></svg>',
  ingreso: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l10-10M5 6h9v9"/></svg>',
  neto: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12M4 12h12"/></svg>',
  ahorro: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-3.3 2.7-6 6-6 2.2 0 4 1 5 2.6.6 0 1 .4 1 1v1c0 .6-.4 1-1 1l-1 2v1.4H12V15H8v1H6v-2c-1.2-.6-2-1.8-2-3z"/><circle cx="13" cy="8" r=".6" fill="currentColor" stroke="none"/></svg>'
};

function pintarIconos(){
  document.getElementById('icoGasto').innerHTML = ICONOS.gasto;
  document.getElementById('icoIngreso').innerHTML = ICONOS.ingreso;
  document.getElementById('icoNeto').innerHTML = ICONOS.neto;
  document.getElementById('icoAhorro').innerHTML = ICONOS.ahorro;
}

function sparklineSVG(values, color){
  if(!values || values.length < 2) return '';
  const w = 76, h = 24, pad = 2;
  const max = Math.max.apply(null, values.concat([1]));
  const min = Math.min.apply(null, values.concat([0]));
  const range = (max - min) || 1;
  const step = (w - pad*2) / (values.length - 1);
  const pts = values.map((v,i) => {
    const x = pad + i*step;
    const y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

let chartTendencia, chartDona;
let TOPES = {}, TIPOS_TOPE = {}, MOVS = [];

Promise.all([cargarCSV(CSV_MOVIMIENTOS), cargarCSV(CSV_TOPES)]).then(([movs, topesRaw]) => {
  topesRaw.forEach(r => {
    const cat = (r['Categoría']||'').trim();
    if(!cat) return;
    TOPES[cat] = Number(r['Tope_Mensual']) || 0;
    TIPOS_TOPE[cat] = (r['Tipo_Tope']||'').trim();
  });
  movs.forEach(m => { m._fecha = parseFecha(m['Fecha']); m._monto = Number(m['Monto']) || 0; });
  MOVS = movs;

  poblarSelectorMes();
  poblarFormulario();
  pintarIconos();

  const hoy = new Date();
  renderMes(hoy.getFullYear(), hoy.getMonth());

  document.getElementById('selectorMes').addEventListener('change', e => {
    const [a, mm] = e.target.value.split('-');
    renderMes(Number(a), Number(mm));
  });

}).catch(err => {
  document.getElementById('ledger').innerHTML = '<div style="color:var(--red); font-size:13px;">No se pudieron cargar los datos. Revisa que el Sheet siga publicado.</div>';
  console.error(err);
});

function poblarSelectorMes(){
  const sel = document.getElementById('selectorMes');
  const hoy = new Date();
  for(let i=0;i<12;i++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    const opt = document.createElement('option');
    opt.value = d.getFullYear() + '-' + d.getMonth();
    opt.textContent = MESES[d.getMonth()] + ' ' + d.getFullYear();
    sel.appendChild(opt);
  }
}

function totalesDeMes(anio, mesIdx){
  const delMes = MOVS.filter(m => m._fecha && m._fecha.getMonth()===mesIdx && m._fecha.getFullYear()===anio);
  const gasto = delMes.filter(m=>m['Tipo']==='Gasto').reduce((a,m)=>a+m._monto,0);
  const ingreso = delMes.filter(m=>m['Tipo']==='Ingreso').reduce((a,m)=>a+m._monto,0);
  const ahorro = delMes.filter(m=>m['Tipo']==='Ahorro').reduce((a,m)=>a+m._monto,0);
  const totalesCat = {};
  delMes.filter(m=>m['Tipo']==='Gasto').forEach(m=>{
    const c = (m['Categoría']||'Sin categoría').trim();
    totalesCat[c] = (totalesCat[c]||0) + m._monto;
  });
  return { delMes, gasto, ingreso, ahorro, totalesCat, nMovs: delMes.filter(m=>m['Tipo']==='Gasto').length };
}

function deltaTexto(actual, anterior){
  if(!anterior) return '';
  const diff = actual - anterior;
  const pct = Math.round((diff/anterior)*100);
  const flecha = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');
  const clase = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
  return ' · <span class="delta ' + clase + '">' + flecha + ' ' + Math.abs(pct) + '% vs. mes anterior</span>';
}

function renderMes(anio, mesIdx){
  document.getElementById('selectorMes').value = anio + '-' + mesIdx;

  const actual = totalesDeMes(anio, mesIdx);
  const anteriorFecha = new Date(anio, mesIdx-1, 1);
  const anterior = totalesDeMes(anteriorFecha.getFullYear(), anteriorFecha.getMonth());

  // Hero
  document.getElementById('heroGasto').textContent = fmt(actual.gasto);
  document.getElementById('heroGastoSub').innerHTML = actual.nMovs + ' movimientos' + deltaTexto(actual.gasto, anterior.gasto);

  document.getElementById('heroIngreso').textContent = fmt(actual.ingreso);
  const cumpleMeta = actual.ingreso >= META_INGRESO_MENSUAL;
  document.getElementById('heroIngresoSub').innerHTML = 'Meta: ' + fmt(META_INGRESO_MENSUAL) + (cumpleMeta ? ' · cumplida ✓' : ' · faltan ' + fmt(META_INGRESO_MENSUAL-actual.ingreso));

  const neto = actual.ingreso - actual.gasto;
  document.getElementById('heroNeto').textContent = fmt(neto);

  document.getElementById('heroAhorro').textContent = fmt(actual.ahorro);
  const metaAhorro = TOPES['Ahorro/Inversion'] || 0;
  document.getElementById('heroAhorroSub').textContent = metaAhorro ? ('Meta: ' + fmt(metaAhorro) + (actual.ahorro>=metaAhorro ? ' · cumplida ✓' : '')) : '';

  // Franja: últimos 6 meses para sparklines (incluye el mes seleccionado)
  const seisMeses = [];
  for(let i=5;i>=0;i--) seisMeses.push(new Date(anio, mesIdx-i, 1));
  const serieGasto = seisMeses.map(d => totalesDeMes(d.getFullYear(), d.getMonth()).gasto);
  const serieIngreso = seisMeses.map(d => totalesDeMes(d.getFullYear(), d.getMonth()).ingreso);
  const serieAhorro = seisMeses.map(d => totalesDeMes(d.getFullYear(), d.getMonth()).ahorro);
  const serieNeto = serieGasto.map((g,i) => serieIngreso[i] - g);

  const totalTopeMaximo = Object.keys(TOPES).filter(c => TIPOS_TOPE[c] === 'Máximo').reduce((a,c)=>a+TOPES[c],0);
  const colorGasto = totalTopeMaximo && actual.gasto >= totalTopeMaximo ? 'var(--red)' : (totalTopeMaximo && actual.gasto >= totalTopeMaximo*0.8 ? 'var(--amber)' : 'var(--text)');
  const colorIngreso = actual.ingreso >= META_INGRESO_MENSUAL ? 'var(--green)' : (actual.ingreso >= META_INGRESO_MENSUAL*0.8 ? 'var(--amber)' : 'var(--red)');
  const colorNeto = neto >= 0 ? 'var(--green)' : 'var(--red)';
  const colorAhorroTxt = metaAhorro && actual.ahorro >= metaAhorro ? 'var(--green)' : 'var(--text)';

  document.getElementById('heroGasto').style.color = colorGasto;
  document.getElementById('heroIngreso').style.color = colorIngreso;
  document.getElementById('heroNeto').style.color = colorNeto;
  document.getElementById('heroAhorro').style.color = colorAhorroTxt;

  document.getElementById('sparkGasto').innerHTML = sparklineSVG(serieGasto, colorGasto === 'var(--text)' ? '#8A97A6' : colorGasto);
  document.getElementById('sparkIngreso').innerHTML = sparklineSVG(serieIngreso, colorIngreso);
  document.getElementById('sparkNeto').innerHTML = sparklineSVG(serieNeto, colorNeto);
  document.getElementById('sparkAhorro').innerHTML = sparklineSVG(serieAhorro, '#6C8EEF');

  // Ledger
  const ledger = document.getElementById('ledger');
  ledger.innerHTML = '';
  const categoriasOrdenadas = Object.keys(TOPES)
    .filter(c => TIPOS_TOPE[c] !== 'Sin tope' || actual.totalesCat[c])
    .sort((a,b) => (actual.totalesCat[b]||0) - (actual.totalesCat[a]||0));

  categoriasOrdenadas.forEach(cat => {
    const gastado = actual.totalesCat[cat] || 0;
    const tope = TOPES[cat] || 0;
    const pct = tope > 0 ? gastado/tope : 0;
    let color = 'var(--green)';
    if(tope > 0 && pct >= 1) color = 'var(--red)';
    else if(tope > 0 && pct >= 0.8) color = 'var(--amber)';
    if(TIPOS_TOPE[cat] === 'Meta mínima') color = gastado >= tope ? 'var(--green)' : 'var(--blue)';

    const row = document.createElement('div');
    row.className = 'ledger-row';
    row.innerHTML = `
      <span class="signal" style="background:${color}"></span>
      <span class="ledger-name">${cat}</span>
      <span class="ledger-amt">${fmt(gastado)}${tope ? ' / ' + fmt(tope) : ''}</span>
      <div class="ledger-bar"><div class="ledger-bar-fill" style="width:${Math.min(pct*100,100)}%; background:${color}"></div></div>
    `;
    ledger.appendChild(row);
  });
  document.getElementById('ledgerCount').textContent = categoriasOrdenadas.length + ' categorías';

  // Tendencia (6 meses hasta el mes seleccionado)
  const mesesAtras = [];
  for(let i=5;i>=0;i--){
    const d = new Date(anio, mesIdx-i, 1);
    mesesAtras.push(d);
  }
  const totalesPorMes = mesesAtras.map(d => totalesDeMes(d.getFullYear(), d.getMonth()).gasto);

  if(chartTendencia) chartTendencia.destroy();
  chartTendencia = new Chart(document.getElementById('chartTendencia'), {
    type:'line',
    data:{
      labels: mesesAtras.map(d => MESES[d.getMonth()].substring(0,3)),
      datasets:[{ data: totalesPorMes, borderColor:'#6C8EEF', backgroundColor:'rgba(108,142,239,.15)', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#6C8EEF' }]
    },
    options:{
      plugins:{legend:{display:false}, title:{display:true, text:'Gasto mensual (últimos 6 meses)', color:'#8A97A6', font:{family:'Inter',size:11}}},
      scales:{
        x:{ ticks:{color:'#8A97A6', font:{family:'Inter',size:11}}, grid:{color:'#2A3A4D'} },
        y:{ ticks:{color:'#8A97A6', font:{family:'JetBrains Mono',size:10}, callback:v=>'$'+(v/1000)+'k'}, grid:{color:'#2A3A4D'} }
      }
    }
  });

  // Dona (mes seleccionado)
  const catsTop = Object.entries(actual.totalesCat).sort((a,b)=>b[1]-a[1]).slice(0,7);
  if(chartDona) chartDona.destroy();
  chartDona = new Chart(document.getElementById('chartDona'), {
    type:'doughnut',
    data:{
      labels: catsTop.map(c=>c[0]),
      datasets:[{ data: catsTop.map(c=>c[1]), backgroundColor:['#6C8EEF','#4ADE94','#F5B942','#F0654E','#9D7BD8','#4FC3D9','#E39BB8'], borderColor:'#172230', borderWidth:2 }]
    },
    options:{
      plugins:{
        legend:{position:'bottom', labels:{color:'#8A97A6', font:{family:'Inter',size:10.5}, boxWidth:10}},
        title:{display:true, text:'Distribución del mes', color:'#8A97A6', font:{family:'Inter',size:11}}
      }
    }
  });

  // Tabla: movimientos del mes seleccionado
  const delMesOrdenado = actual.delMes.slice().sort((a,b)=>b._fecha-a._fecha);
  pintarTabla(delMesOrdenado, '');
  document.getElementById('buscador').oninput = e => pintarTabla(delMesOrdenado, e.target.value);
}

function pintarTabla(lista, filtro){
  const tbody = document.getElementById('tablaBody');
  const f = (filtro||'').toLowerCase();
  const filtrados = lista.filter(m => !f ||
    (m['Comercio_Descripción']||'').toLowerCase().includes(f) ||
    (m['Categoría']||'').toLowerCase().includes(f));
  tbody.innerHTML = filtrados.length ? '' : '<tr><td colspan="5" style="color:var(--muted);">Sin resultados</td></tr>';
  filtrados.forEach(m => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${m['Fecha']||''}</td><td><span class="tag">${m['Tipo']||''}</span></td><td>${m['Categoría']||'—'}</td><td>${m['Comercio_Descripción']||''}</td><td class="amt">${fmt(m._monto)}</td>`;
    tbody.appendChild(tr);
  });
}

function poblarFormulario(){
  const fCategoria = document.getElementById('fCategoria');
  Object.keys(TOPES).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    fCategoria.appendChild(opt);
  });

  const fTipo = document.getElementById('fTipo');
  const fCategoriaWrap = document.getElementById('fCategoriaWrap');
  function actualizarVisibilidadCategoria(){
    fCategoriaWrap.style.display = (fTipo.value === 'Gasto' || fTipo.value === 'Ahorro') ? 'block' : 'none';
  }
  fTipo.addEventListener('change', actualizarVisibilidadCategoria);
  actualizarVisibilidadCategoria();

  document.getElementById('fSubmit').addEventListener('click', () => {
    const btn = document.getElementById('fSubmit');
    const msg = document.getElementById('fMsg');
    const monto = document.getElementById('fMonto').value;
    if(!monto || Number(monto) <= 0){
      msg.textContent = 'Ingresa un monto válido.'; msg.className = 'form-msg err'; return;
    }
    btn.disabled = true; msg.textContent = 'Registrando…'; msg.className = 'form-msg';
    fetch(WEBAPP_URL, {
      method:'POST',
      body: JSON.stringify({
        accion:'registrar', secreto: DASHBOARD_SECRET,
        tipo: fTipo.value, monto: monto,
        categoria: (fTipo.value==='Gasto'||fTipo.value==='Ahorro') ? fCategoria.value : '',
        cuenta: document.getElementById('fCuenta').value,
        medio: document.getElementById('fMedio').value,
        descripcion: document.getElementById('fDescripcion').value
      })
    }).then(r => r.json()).then(r => {
      btn.disabled = false;
      if(r.ok){
        msg.textContent = '✅ Registrado. Se reflejará al recargar la página.'; msg.className = 'form-msg ok';
        document.getElementById('fMonto').value = ''; document.getElementById('fDescripcion').value = '';
      } else {
        msg.textContent = '⚠️ ' + (r.error||'Error al registrar.'); msg.className = 'form-msg err';
      }
    }).catch(() => {
      btn.disabled = false;
      msg.textContent = '⚠️ No se pudo conectar. Puedes registrar por Telegram mientras revisamos esto.';
      msg.className = 'form-msg err';
    });
  });
}
</script>
